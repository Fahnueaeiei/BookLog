name: BookLog Tests

on:
  push:
    branches:
      - main
      - sprint-3
  pull_request:
    branches:
      - main
      - sprint-3

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests streamlit python-dotenv

      - name: Run Sprint 3 tests
        run: |
          python -m pytest Sprint3/frontend/test/test_sprint3_full.py -v
